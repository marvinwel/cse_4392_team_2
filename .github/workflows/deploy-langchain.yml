name: Build and Deploy LangChain API

on:
  push:
    branches:
      - main
    paths:
      - "project2/langchain/**"
      - ".github/workflows/deploy-langchain.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: langchain-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::142366489964:role/GitHubActions-UTA-AI-Advisor-ECR
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uta-ai-advisor-langchain
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 -t "$IMAGE" ./project2/langchain
          docker push "$IMAGE"

      - name: Deploy to EC2 using SSM
        env:
          INSTANCE_ID: i-049be601dd51fe3eb
          IMAGE: 142366489964.dkr.ecr.us-east-2.amazonaws.com/uta-ai-advisor-langchain:${{ github.sha }}
        run: |
          set -euo pipefail
          COMMANDS=$(python3 - <<'PY'
          import json, os
          image = os.environ['IMAGE']
          commands = [
              'set -e',
              'aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 142366489964.dkr.ecr.us-east-2.amazonaws.com',
              f'docker pull {image}',
              'docker rm -f uta-langchain || true',
              ('docker run -d --name uta-langchain --restart unless-stopped '
               '-p 8001:8001 '
               '-e AWS_REGION=us-east-2 '
               '-e BEDROCK_MODEL_ID=google.gemma-3-27b-it '
               '-e CHROMA_URL=http://3.19.68.190:8000 '
               '-e CHROMA_COLLECTION_ID=2700ece6-2519-4fc4-8db0-f72353e5ac63 '
               f'{image}'),
              'for i in $(seq 1 30); do if curl --fail --silent --max-time 5 http://localhost:8001/health; then exit 0; fi; echo "Waiting for FastAPI..."; sleep 5; done; docker logs uta-langchain; exit 1'
          ]
          print(json.dumps({'commands': commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Deploy UTA AI Advisor LangChain API' \
            --parameters "$COMMANDS" \
            --query Command.CommandId \
            --output text)

          echo "SSM command: $COMMAND_ID"
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
