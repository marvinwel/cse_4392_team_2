name: Build and Deploy Chat UI

on:
  push:
    branches:
      - main
    paths:
      - "project2/chat-ui/**"
      - ".github/workflows/deploy-chatui.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: chatui-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::142366489964:role/GitHubActions-UTA-AI-Advisor-ECR
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uta-ai-advisor-chatui
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" ./project2/chat-ui
          docker push "$IMAGE"

      - name: Deploy to EC2 using SSM
        env:
          INSTANCE_ID: i-08f997ac53ddeabc0
          IMAGE: 142366489964.dkr.ecr.us-east-2.amazonaws.com/uta-ai-advisor-chatui:${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy UTA AI Advisor Chat UI" \
            --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 142366489964.dkr.ecr.us-east-2.amazonaws.com\",
              \"docker pull $IMAGE\",
              \"docker rm -f uta-chatui || true\",
              \"docker run -d --name uta-chatui --restart unless-stopped -p 80:80 $IMAGE\",
              \"for i in {1..30}; do if curl --fail --silent --show-error --max-time 5 http://localhost:80/_stcore/health; then exit 0; fi; echo 'Waiting for Streamlit...'; sleep 5; done; exit 1\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'