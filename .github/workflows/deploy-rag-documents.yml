
name: Deploy RAG Documents to S3

on:
  push:
    branches:
      - main
    paths:
      - "project2/rag/documents/**"
      - ".github/workflows/deploy-rag-documents.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  upload-documents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::142366489964:role/GitHubActions-UTA-AI-Advisor-RAG-S3
          aws-region: us-east-2

      - name: Upload documents to S3
        run: |
          aws s3 sync \
            project2/rag/documents/ \
            s3://uta-ai-advisor-rag-documents-142366489964/documents/ \
            --no-progress
